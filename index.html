<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WG Sandwich-Bestellung</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">

  <section id="loginView" class="card login">
    <h1>🥪 WG Sandwiches</h1>
    <p>Logg dich ein, um etwas zu bestellen.</p>
    <input id="username" placeholder="Benutzername" autocomplete="username">
    <input id="password" type="password" placeholder="Passwort" autocomplete="current-password">
    <button id="loginBtn">Einloggen</button>
    <p id="loginMsg" class="error"></p>
  </section>

  <section id="shopView" class="hidden">
    <header class="topbar">
      <div>
        <h1>🥪 Sandwiches</h1>
        <span id="shopUser"></span>
      </div>
      <button class="secondary" id="logoutBtn">Ausloggen</button>
    </header>

    <div class="card">
      <h2>Bestellung</h2>
      <div id="products"></div>
      <button id="orderBtn">Bestellung abschicken</button>
      <p id="orderMsg"></p>
    </div>
  </section>

  <section id="adminView" class="hidden">
    <header class="topbar">
      <div>
        <h1>📊 WG-Dashboard</h1>
        <span id="adminUser"></span>
      </div>
      <button class="secondary" id="adminLogoutBtn">Ausloggen</button>
    </header>

    <div class="card">
      <div class="dashboardHead">
        <h2>Gesamtbestellungen</h2>
        <button id="refreshBtn">↻ Aktualisieren</button>
      </div>
      <div id="totals"></div>
    </div>

    <div class="card">
      <h2>Wer hat was bestellt?</h2>
      <div id="orders"></div>
    </div>

    <div class="card dangerBox">
      <h2>Bestellungen löschen</h2>
      <p>Löscht den kompletten Inhalt von <code>bestellungen.txt</code>.</p>
      <button class="danger" id="clearBtn">Alle Bestellungen löschen</button>
      <p id="clearMsg"></p>
    </div>
  </section>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
